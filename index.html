<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b18">
<title>NEXI PHONE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="wallpaper"></div>
  <div class="island" id="island"></div>

  <div class="status">
    <span id="statusTime">12:00</span>
    <span>●●● ◉ ▰</span>
  </div>

  <header class="top">
    <div id="lockDate"></div>
    <div id="lockClock"></div>
    <div id="greeting">NEXI PHONE</div>
  </header>

  <main id="screen">
    <div class="widget">
      <div>
        <small>WILLKOMMEN BEI</small>
        <h2>NEXI PHONE</h2>
        <p>Dein Smartphone. Dein System.</p>
      </div>
      <div class="widget-symbol">✦</div>
    </div>

    <section class="app-grid" id="apps"></section>

    <div class="dock" id="dock"></div>
  </main>

  <div class="home-line" onclick="goHome()"></div>
</div>
<script src="script.js"></script>
</body>
</html>
